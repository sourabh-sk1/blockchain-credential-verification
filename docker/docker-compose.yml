version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: credential-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: academic-credentials
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - credential-network

  # Backend API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: credential-backend
    environment:
      NODE_ENV: production
      BACKEND_PORT: 5000
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/academic-credentials?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-dev_secret_key}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      FABRIC_CA_URL: http://ca.example.com:7054
      FABRIC_PEER_URL: grpc://peer0.example.com:7051
      FABRIC_ORDERER_URL: grpc://orderer.example.com:7050
      FABRIC_CHANNEL_NAME: credential-channel
      FABRIC_CHAINCODE_NAME: credential-contract
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - credential-network
    volumes:
      - ../blockchain/hyperledger-fabric:/app/blockchain/hyperledger-fabric

  # Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: credential-frontend
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5000/api}
      REACT_APP_NETWORK_NAME: ${REACT_APP_NETWORK_NAME:-local-fabric}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - credential-network

  # IPFS Node (optional)
  ipfs:
    image: ipfs/kubo:latest
    container_name: credential-ipfs
    ports:
      - "5001:5001"
      - "8080:8080"
    volumes:
      - ipfs-data:/data/ipfs
    networks:
      - credential-network

volumes:
  mongodb-data:
  ipfs-data:

networks:
  credential-network:
    driver: bridge
